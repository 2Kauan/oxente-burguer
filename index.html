<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>🍔 Oxente Burger — Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "DM Sans", sans-serif;
      background: linear-gradient(135deg, #1c1a17 0%, #2e2b27 100%);
      color: #f0e8db;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 600px;
      width: 100%;
    }
    h1 {
      font-family: "Fraunces", serif;
      font-size: 48px;
      font-weight: 900;
      margin-bottom: 8px;
      color: white;
    }
    .subtitle {
      font-size: 14px;
      color: #80756c;
      margin-bottom: 36px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }
    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      padding: 24px;
      border-radius: 14px;
      border: 2px solid #3a3632;
      background: rgba(37, 35, 32, 0.6);
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card:hover {
      border-color: #e8521a;
      background: rgba(232, 82, 26, 0.1);
      transform: translateY(-2px);
    }
    .card-icon {
      font-size: 32px;
    }
    .card-title {
      font-weight: 700;
      font-size: 16px;
      color: #f0e8db;
    }
    .card-desc {
      font-size: 12px;
      color: #80756c;
    }
    .admin-card {
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍔 Oxente Burger</h1>
    <p class="subtitle">Sistema Completo de Pedidos — Demo Interativa</p>

    <div class="grid">
      <a href="burger-system/admin/index.html" class="card admin-card">
        <div class="card-icon">⚙️</div>
        <div class="card-title">Painel do Dono</div>
        <div class="card-desc">Veja todos os pedidos, faturamento e controle total</div>
      </a>

      <a href="burger-system/client/index.html?mesa=1&token=tok_mesa1_abc123" class="card">
        <div class="card-icon">📱</div>
        <div class="card-title">App da Mesa</div>
        <div class="card-desc">O que o cliente vê no celular</div>
      </a>

      <a href="burger-system/kitchen/index.html" class="card">
        <div class="card-icon">🔥</div>
        <div class="card-title">Tela Cozinha</div>
        <div class="card-desc">O que vê na cozinha</div>
      </a>

      <a href="burger-system/delivery/index.html" class="card" style="grid-column: 1 / -1;">
        <div class="card-icon">🛵</div>
        <div class="card-title">App de Delivery</div>
        <div class="card-desc">Pedido feito direto do celular em casa</div>
      </a>
    </div>
  </div>
</body>
</html>
