<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>🔥 Cozinha — BurgerHouse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;900&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ═══════════════════════════════════════════════════════════
       DESIGN — Cozinha
       Estética: INDUSTRIAL MAXIMAL — preta, contrastes extremos
       Fonte condensada grande → leitura rápida à distância
       Sem distrações — só o que importa para o cozinheiro
    ═══════════════════════════════════════════════════════════ */
      :root {
        --bg: #0a0a0a;
        --card: #111;
        --card2: #161616;
        --b: #222;
        --b2: #2a2a2a;
        --text: #f0f0f0;
        --muted: #555;
        --dim: #1e1e1e;
        --pend: #f5a623;
        --prep: #e8521a;
        --done: #3dbe6c;
        --mesa1: #4e9af1;
        --mesa2: #b87fff;
        --mesa3: #ff7eb3;
        --mesa4: #4ecdc4;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: "Barlow", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }

      /* ── Header ── */
      .kds-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        height: 56px;
        background: #000;
        border-bottom: 2px solid var(--prep);
        flex-shrink: 0;
      }
      .kds-brand {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 3px;
        color: white;
      }
      .kds-brand span {
        color: var(--prep);
      }
      .kds-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .kds-clock {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 20px;
        color: var(--muted);
        letter-spacing: 2px;
      }
      .kds-count {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 14px;
        color: var(--muted);
        letter-spacing: 1px;
      }
      .kds-count b {
        color: var(--pend);
        font-size: 18px;
      }
      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--done);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          box-shadow: 0 0 0 0 rgba(61, 190, 108, 0.4);
        }
        50% {
          opacity: 0.6;
          box-shadow: 0 0 0 6px rgba(61, 190, 108, 0);
        }
      }

      /* ── Column tabs ── */
      .col-tabs {
        display: flex;
        background: #000;
        border-bottom: 1px solid var(--b);
        flex-shrink: 0;
      }
      .col-tab {
        flex: 1;
        padding: 10px;
        text-align: center;
        font-family: "Barlow Condensed", sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--muted);
        cursor: pointer;
        border: none;
        background: none;
        transition: all 0.2s;
        border-bottom: 2px solid transparent;
        text-transform: uppercase;
      }
      .col-tab.active {
        color: var(--text);
        border-bottom-color: var(--prep);
      }

      /* ── Main grid ── */
      .kds-body {
        flex: 1;
        overflow: hidden;
        display: flex;
        gap: 0;
      }

      /* ── Column ── */
      .kds-col {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        border-right: 1px solid var(--b);
        scrollbar-width: thin;
        scrollbar-color: var(--b) transparent;
      }
      .kds-col:last-child {
        border-right: none;
      }
      .col-header {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 10px;
        padding: 0 2px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .col-header-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }

      /* ── Order card ── */
      .kds-card {
        background: var(--card);
        border: 2px solid var(--b2);
        border-radius: 10px;
        margin-bottom: 10px;
        overflow: hidden;
        animation: cardIn 0.25s ease;
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .kds-card.urgent {
        border-color: var(--pend);
        animation:
          cardIn 0.25s ease,
          urgentPulse 2s 0.5s infinite;
      }
      @keyframes urgentPulse {
        0%,
        100% {
          border-color: var(--pend);
        }
        50% {
          border-color: #7a5000;
        }
      }

      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: var(--card2);
        border-bottom: 1px solid var(--b2);
      }
      .card-mesa {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 1px;
      }
      .card-meta {
        text-align: right;
      }
      .card-time {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 14px;
        color: var(--muted);
      }
      .card-age {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 13px;
        margin-top: 1px;
      }
      .age-ok {
        color: var(--done);
      }
      .age-warn {
        color: var(--pend);
      }
      .age-crit {
        color: var(--prep);
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* Mesa color accents */
      .mesa-1 .card-mesa {
        color: var(--mesa1);
      }
      .mesa-2 .card-mesa {
        color: var(--mesa2);
      }
      .mesa-3 .card-mesa {
        color: var(--mesa3);
      }
      .mesa-4 .card-mesa {
        color: var(--mesa4);
      }
      .mesa-1 {
        border-left: 4px solid var(--mesa1);
      }
      .mesa-2 {
        border-left: 4px solid var(--mesa2);
      }
      .mesa-3 {
        border-left: 4px solid var(--mesa3);
      }
      .mesa-4 {
        border-left: 4px solid var(--mesa4);
      }

      /* ── Items list ── */
      .card-items {
        padding: 10px 14px;
      }
      .kds-item {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px solid var(--b);
      }
      .kds-item:last-child {
        border-bottom: none;
      }
      .item-qty {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 22px;
        font-weight: 900;
        color: var(--prep);
        min-width: 26px;
        line-height: 1;
      }
      .item-name {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.2;
      }
      .item-obs {
        display: block;
        font-size: 11px;
        color: var(--pend);
        font-style: italic;
        margin-top: 2px;
      }

      /* ── Action buttons ── */
      .card-actions {
        padding: 10px 14px;
        display: flex;
        gap: 8px;
        border-top: 1px solid var(--b2);
      }
      .act-btn {
        flex: 1;
        padding: 12px 8px;
        border-radius: 7px;
        border: none;
        font-family: "Barlow Condensed", sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1.5px;
        cursor: pointer;
        transition: all 0.15s;
        text-transform: uppercase;
      }
      .act-btn:active {
        transform: scale(0.96);
      }
      .act-start {
        background: var(--pend);
        color: #000;
      }
      .act-start:hover {
        background: #d4870a;
      }
      .act-done {
        background: var(--done);
        color: #000;
      }
      .act-done:hover {
        background: #2da057;
      }
      .act-undo {
        background: var(--b2);
        color: var(--muted);
        flex: 0;
        padding: 12px 14px;
        font-size: 12px;
      }

      /* ── Empty col ── */
      .col-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 200px;
        color: var(--muted);
        gap: 8px;
      }
      .col-empty-icon {
        font-size: 36px;
        opacity: 0.3;
      }
      .col-empty-txt {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 16px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* ── Alert banner ── */
      .kds-alert {
        position: fixed;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        background: #000;
        border: 2px solid var(--prep);
        border-radius: 8px;
        padding: 12px 20px;
        font-family: "Barlow Condensed", sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--prep);
        z-index: 999;
        opacity: 0;
        transition: all 0.3s;
        pointer-events: none;
        white-space: nowrap;
        text-transform: uppercase;
      }
      .kds-alert.show {
        opacity: 1;
        transform: translateX(-50%) translateY(4px);
      }

      /* ── Mobile: single column scroll ── */
      @media (max-width: 700px) {
        .kds-body {
          flex-direction: column;
          overflow-y: auto;
          overflow-x: hidden;
        }
        .kds-col {
          flex: none;
          border-right: none;
          border-bottom: 1px solid var(--b);
          overflow-y: visible;
          padding: 10px;
        }
        html,
        body {
          overflow: auto;
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="kds-header">
      <div class="kds-brand">🔥 <span>COZINHA</span> · BurgerHouse</div>
      <div class="kds-right">
        <div class="kds-count">Pendentes: <b id="cnt-pend">0</b></div>
        <div class="kds-clock" id="kds-clock">--:--</div>
        <div class="live-dot"></div>
      </div>
    </header>

    <div class="col-tabs">
      <button class="col-tab active" onclick="setView('board')" id="vtab-board">
        📋 QUADRO
      </button>
      <button class="col-tab" onclick="setView('list')" id="vtab-list">
        📜 LISTA
      </button>
    </div>

    <div class="kds-body" id="kds-body">
      <!-- Rendered by JS -->
    </div>

    <div class="kds-alert" id="kds-alert"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      /* ═══════════════════════════════════════════════════════════════
   KITCHEN DISPLAY SYSTEM (KDS) - API + WEBSOCKET
═══════════════════════════════════════════════════════════════ */

      const socket = io();

      // ── Audio (Web Audio API) ─────────────────────────────────────
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      let audioCtx = null;
      function getAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
        return audioCtx;
      }

      function beep(freq = 880, dur = 0.12, vol = 0.3) {
        try {
          const ctx = getAudio();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = freq;
          osc.type = "sine";
          gain.gain.setValueAtTime(vol, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
          osc.start();
          osc.stop(ctx.currentTime + dur);
        } catch (e) {}
      }

      function alertSound() {
        beep(1000, 0.1, 0.4);
        setTimeout(() => beep(1200, 0.15, 0.35), 120);
      }
      function readySound() {
        beep(660, 0.15, 0.3);
        setTimeout(() => beep(880, 0.2, 0.35), 160);
      }

      // ── State ─────────────────────────────────────────────────────
      let currentView = "board";
      let ACTIVE_ORDERS = [];

      function setView(v) {
        currentView = v;
        document
          .querySelectorAll(".col-tab")
          .forEach((t) => t.classList.remove("active"));
        document.getElementById(`vtab-${v}`).classList.add("active");
        render();
      }

      // ── Helpers ───────────────────────────────────────────────────
      function fmt(v) {
        return new Intl.NumberFormat("pt-BR", {
          style: "currency",
          currency: "BRL",
        }).format(v);
      }
      function fmtTime(ts) {
        return new Date(ts).toLocaleTimeString("pt-BR", {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function getAgeMin(ts) {
        return Math.floor((Date.now() - ts) / 60000);
      }

      function ageClass(ts) {
        const m = getAgeMin(ts);
        if (m < 5) return "age-ok";
        if (m < 10) return "age-warn";
        return "age-crit";
      }

      function ageLabel(ts) {
        const m = getAgeMin(ts);
        const s = Math.floor((Date.now() - ts) / 1000);
        if (s < 60) return `${s}s`;
        return `${m}min`;
      }

      async function fetchOrders() {
        try {
          const res = await fetch('/api/sessions');
          const json = await res.json();
          const sessions = json.data || [];
          
          let orders = [];
          sessions.forEach((sess) => {
            if (sess.status === "closed") return;
            (sess.orders || []).forEach((o) => {
              if (o.status === "pending" || o.status === "preparing") {
                orders.push({ ...o, mesa: sess.mesa, sessionId: sess.sessionId });
              }
            });
          });
          
          ACTIVE_ORDERS = orders.sort((a, b) => a.createdAt - b.createdAt);
          render();
        } catch(e) {
          console.error("Erro ao carregar pedidos", e);
        }
      }

      // ── Update status ─────────────────────────────────────────────
      async function setStatus(sessionId, orderId, status) {
        try {
          const res = await fetch(`/api/orders/${orderId}/status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, status })
          });
          if(res.ok) {
            // Local update for snappiness, true update comes via socket
            const o = ACTIVE_ORDERS.find(o => o.orderId === orderId);
            if(o) o.status = status;
            if (status === "done") readySound();
            if (status === "done" && o) {
               // remove from active if done
               ACTIVE_ORDERS = ACTIVE_ORDERS.filter(x => x.orderId !== orderId);
            }
            render();
          }
        } catch(e) {
          console.error("Erro ao atualizar pedido", e);
        }
      }

      // ── Render board (3 columns) ──────────────────────────────────
      function renderBoard(orders) {
        const pending = orders.filter((o) => o.status === "pending");
        const preparing = orders.filter((o) => o.status === "preparing");

        document.getElementById("kds-body").innerHTML = `
    <div class="kds-col" id="col-pend">
      <div class="col-header"><div class="col-header-dot" style="background:var(--pend)"></div>AGUARDANDO (${pending.length})</div>
      ${pending.length ? pending.map((o) => cardHtml(o, "pending")).join("") : '<div class="col-empty"><div class="col-empty-icon">✓</div><div class="col-empty-txt">Tudo limpo</div></div>'}
    </div>
    <div class="kds-col" id="col-prep">
      <div class="col-header"><div class="col-header-dot" style="background:var(--prep)"></div>EM PREPARO (${preparing.length})</div>
      ${preparing.length ? preparing.map((o) => cardHtml(o, "preparing")).join("") : '<div class="col-empty"><div class="col-empty-icon">🍳</div><div class="col-empty-txt">Nenhum em preparo</div></div>'}
    </div>
  `;
      }

      // ── Render list (single column, all orders) ───────────────────
      function renderList(orders) {
        document.getElementById("kds-body").innerHTML = `
    <div class="kds-col" style="max-width:600px;margin:0 auto;border:none">
      <div class="col-header"><div class="col-header-dot" style="background:var(--prep)"></div>TODOS OS PEDIDOS ATIVOS (${orders.length})</div>
      ${orders.length ? orders.map((o) => cardHtml(o, o.status)).join("") : '<div class="col-empty"><div class="col-empty-icon">🎉</div><div class="col-empty-txt">Nenhum pedido ativo</div></div>'}
    </div>
  `;
      }

      function cardHtml(o, status) {
        const age = getAgeMin(o.createdAt);
        const urgent = status === "pending" && age >= 8;
        return `<div class="kds-card mesa-${o.mesa}${urgent ? " urgent" : ""}">
    <div class="card-top">
      <div class="card-mesa">MESA ${o.mesa}</div>
      <div class="card-meta">
        <div class="card-time">${fmtTime(o.createdAt)}</div>
        <div class="card-age ${ageClass(o.createdAt)}">${ageLabel(o.createdAt)} atrás</div>
      </div>
    </div>
    <div class="card-items">
      ${o.itens
        .map(
          (i) => `<div class="kds-item">
        <span class="item-qty">${i.quantidade}×</span>
        <div><span class="item-name">${i.nome}</span>${i.observacao ? `<span class="item-obs">📝 ${i.observacao}</span>` : ""}</div>
      </div>`,
        )
        .join("")}
    </div>
    <div class="card-actions">
      ${
        status === "pending"
          ? `<button class="act-btn act-start" onclick="setStatus('${o.sessionId}','${o.orderId}','preparing')">▶ INICIAR</button>`
          : `<button class="act-btn act-done"  onclick="setStatus('${o.sessionId}','${o.orderId}','done')">✓ PRONTO</button>
          <button class="act-btn act-undo"  onclick="setStatus('${o.sessionId}','${o.orderId}','pending')">↩</button>`
      }
    </div>
  </div>`;
      }

      function render() {
        document.getElementById("cnt-pend").textContent = ACTIVE_ORDERS.filter(
          (o) => o.status === "pending",
        ).length;
        if (currentView === "board") renderBoard(ACTIVE_ORDERS);
        else renderList(ACTIVE_ORDERS);
      }

      // ── Alert banner ──────────────────────────────────────────────
      function showAlert(msg) {
        const el = document.getElementById("kds-alert");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(window._at);
        window._at = setTimeout(() => el.classList.remove("show"), 3500);
      }

      // ── Clock ─────────────────────────────────────────────────────
      function updateClock() {
        document.getElementById("kds-clock").textContent =
          new Date().toLocaleTimeString("pt-BR", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
      }

      // ── Sockets ───────────────────────────────────────────────────
      socket.on('order:new', (data) => {
         const newOrder = { ...data.order, mesa: data.mesa, sessionId: data.sessionId };
         ACTIVE_ORDERS.push(newOrder);
         ACTIVE_ORDERS.sort((a, b) => a.createdAt - b.createdAt);
         alertSound();
         showAlert(`🆕 NOVO PEDIDO — MESA ${data.mesa}!`);
         render();
      });

      socket.on('order:status', (data) => {
         const o = ACTIVE_ORDERS.find(x => x.orderId === data.orderId);
         if(o) {
            o.status = data.status;
            if(data.status === 'done') {
              ACTIVE_ORDERS = ACTIVE_ORDERS.filter(x => x.orderId !== data.orderId);
            }
         }
         render();
      });

      // ── Boot ──────────────────────────────────────────────────────
      fetchOrders();
      setInterval(render, 30000); // re-render para atualizar os contadores de tempo (idade do pedido)
      setInterval(updateClock, 1000);
      updateClock();

      // Ativar audio após primeiro clique (browser policy)
      document.addEventListener(
        "click",
        () => {
          try {
            getAudio().resume();
          } catch (e) {}
        },
        { once: true },
      );
    </script>
  </body>
</html>
